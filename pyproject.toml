[project]
name = "shopping-agent"
version = "0.1.0"
description = "Shopping-list agent using Microsoft Agent Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-azure-contentunderstanding",
    "agent-framework-foundry",
    "azure-ai-contentunderstanding",
    "azure-identity",
    "azure-monitor-opentelemetry",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
shopping-agent = "shopping_agent.app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
